<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030" />
      <stop offset="45%" stop-color="#241338" />
      <stop offset="100%" stop-color="#0a0812" />
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a4a6e" />
      <stop offset="100%" stop-color="#2a2038" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bldgFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f3d" />
      <stop offset="100%" stop-color="#1c1428" />
    </linearGradient>
    <linearGradient id="bldgMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241c36" />
      <stop offset="100%" stop-color="#161020" />
    </linearGradient>
    <linearGradient id="bldgNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1526" />
      <stop offset="100%" stop-color="#0d0a14" />
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a52" stop-opacity="0" />
      <stop offset="100%" stop-color="#241a38" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- muted moon -->
  <circle cx="1220" cy="180" r="220" fill="url(#moon)" opacity="0.4" />
  <circle cx="1220" cy="180" r="70" fill="#4a3f5e" opacity="0.35" />

  <!-- faint stars -->
  <g fill="#8a7fae" opacity="0.35">
    <circle cx="120" cy="90" r="1.6" /><circle cx="260" cy="150" r="1.2" />
    <circle cx="410" cy="60" r="1.4" /><circle cx="600" cy="120" r="1.1" />
    <circle cx="760" cy="70" r="1.6" /><circle cx="900" cy="160" r="1.2" />
    <circle cx="1050" cy="90" r="1.3" /><circle cx="1400" cy="110" r="1.5" />
    <circle cx="1500" cy="200" r="1.1" /><circle cx="80" cy="220" r="1.2" />
  </g>

  <!-- far buildings (muted purple) -->
  <g fill="url(#bldgFar)" opacity="0.7">
    <rect x="0" y="480" width="120" height="260" />
    <rect x="140" y="440" width="90" height="300" />
    <rect x="250" y="500" width="140" height="240" />
    <rect x="410" y="420" width="100" height="320" />
    <rect x="530" y="470" width="130" height="270" />
    <rect x="680" y="440" width="110" height="300" />
    <rect x="810" y="490" width="150" height="250" />
    <rect x="980" y="430" width="120" height="310" />
    <rect x="1120" y="470" width="140" height="270" />
    <rect x="1280" y="450" width="100" height="290" />
    <rect x="1400" y="500" width="200" height="240" />
  </g>

  <!-- faint window lights, far layer -->
  <g fill="#8a6fae" opacity="0.25">
    <rect x="20" y="520" width="6" height="10" /><rect x="40" y="560" width="6" height="10" />
    <rect x="170" y="480" width="6" height="10" /><rect x="270" y="540" width="6" height="10" />
    <rect x="440" y="460" width="6" height="10" /><rect x="560" y="510" width="6" height="10" />
    <rect x="710" y="480" width="6" height="10" /><rect x="840" y="530" width="6" height="10" />
    <rect x="1010" y="470" width="6" height="10" /><rect x="1150" y="510" width="6" height="10" />
  </g>

  <!-- mid buildings -->
  <g fill="url(#bldgMid)">
    <rect x="60" y="560" width="160" height="300" />
    <rect x="240" y="600" width="120" height="260" />
    <rect x="380" y="540" width="150" height="320" />
    <rect x="560" y="590" width="130" height="270" />
    <rect x="720" y="550" width="170" height="310" />
    <rect x="920" y="600" width="140" height="260" />
    <rect x="1090" y="560" width="160" height="300" />
    <rect x="1280" y="580" width="130" height="280" />
    <rect x="1440" y="540" width="160" height="320" />
  </g>

  <!-- mid-layer neon accent windows (cyan/pink/gold, muted opacity per feedback) -->
  <g opacity="0.28">
    <rect x="90" y="600" width="10" height="14" fill="#00e5ff" />
    <rect x="90" y="640" width="10" height="14" fill="#ff2e88" />
    <rect x="130" y="620" width="10" height="14" fill="#ffd700" />
    <rect x="270" y="640" width="10" height="14" fill="#00e5ff" />
    <rect x="420" y="600" width="10" height="14" fill="#ff2e88" />
    <rect x="460" y="650" width="10" height="14" fill="#9d4edd" />
    <rect x="600" y="630" width="10" height="14" fill="#00e5ff" />
    <rect x="760" y="600" width="10" height="14" fill="#ffd700" />
    <rect x="800" y="650" width="10" height="14" fill="#ff2e88" />
    <rect x="960" y="640" width="10" height="14" fill="#00e5ff" />
    <rect x="1120" y="610" width="10" height="14" fill="#9d4edd" />
    <rect x="1160" y="660" width="10" height="14" fill="#ffd700" />
    <rect x="1310" y="620" width="10" height="14" fill="#ff2e88" />
    <rect x="1470" y="600" width="10" height="14" fill="#00e5ff" />
  </g>

  <!-- near buildings, darkest -->
  <g fill="url(#bldgNear)">
    <rect x="-20" y="700" width="220" height="220" />
    <rect x="220" y="740" width="180" height="180" />
    <rect x="440" y="690" width="200" height="230" />
    <rect x="680" y="730" width="170" height="190" />
    <rect x="890" y="700" width="220" height="220" />
    <rect x="1150" y="740" width="190" height="180" />
    <rect x="1380" y="700" width="240" height="220" />
  </g>

  <!-- faint neon signage strokes on near buildings, low opacity -->
  <g opacity="0.22" stroke-width="2" fill="none">
    <line x1="60" y1="760" x2="140" y2="760" stroke="#00e5ff" />
    <line x1="480" y1="750" x2="580" y2="750" stroke="#ff2e88" />
    <line x1="940" y1="770" x2="1040" y2="770" stroke="#ffd700" />
    <line x1="1420" y1="760" x2="1520" y2="760" stroke="#9d4edd" />
  </g>

  <!-- horizon haze -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#haze)" />

  <!-- overall dimming veil to keep the app's UI readable and the palette muted -->
  <rect width="1600" height="900" fill="#08060f" opacity="0.55" />
</svg>
